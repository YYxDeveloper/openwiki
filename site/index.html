<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenWiki</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --link: #0969da;
      --border: #d1d9e0;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9198a1;
        --link: #4493f8;
        --border: #3d444d;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #9198a1;
      --link: #4493f8;
      --border: #3d444d;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 16px;
    }
    h1 { margin-top: 0; }
    p.lead { color: var(--muted); }
    ul { padding-left: 20px; }
    li { margin: 10px 0; }
    a { color: var(--link); }
    .note {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>OpenWiki</h1>
    <p class="lead">這是 OpenWiki 的靜態入口頁。內容來源為 repo 內的 <code>openwiki/</code> 資料夾，實際頁面以 GitHub 渲染為準。</p>
    <ul>
      <li><a href="https://github.com/YYxDeveloper/openwiki/blob/main/openwiki/index.md">Wiki 首頁（index）</a></li>
      <li><a href="https://github.com/YYxDeveloper/openwiki/blob/main/openwiki/overview.md">概覽（overview）</a></li>
      <li><a href="https://github.com/YYxDeveloper/openwiki/blob/main/openwiki/quickstart.md">快速開始（quickstart）</a></li>
      <li><a href="https://github.com/YYxDeveloper/openwiki/blob/main/openwiki/setup.md">安裝與 MCP 整合（setup）</a></li>
      <li><a href="https://github.com/YYxDeveloper/openwiki/blob/main/openwiki/articles.md">參考文章收錄（articles）</a></li>
      <li><a href="https://github.com/YYxDeveloper/openwiki/blob/main/openwiki/opencode-shortcuts.md">OpenCode 快捷鍵（opencode-shortcuts）</a></li>
      <li><a href="docs/index.html">文件索引（docs）：網站上的完整文章與簡報</a></li>
    </ul>
    <p class="note">原始碼與完整文件：<a href="https://github.com/YYxDeveloper/openwiki">github.com/YYxDeveloper/openwiki</a></p>
  </main>
</body>
</html>
